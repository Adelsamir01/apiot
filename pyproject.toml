[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiot"
version = "2.0.0"
description = "Autonomous Purple Team IoT Security Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
apiot = "apiot.core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apiot*"]
