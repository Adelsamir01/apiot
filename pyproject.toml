[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apiot"
version = "2.1.0"
description = "Autonomous Purple Team IoT Security Agent"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
apiot = "apiot.core.cli:main"

[tool.setuptools.package-dir]
apiot = "."

[tool.setuptools.packages.find]
where = [".."]
include = ["apiot", "apiot.*"]
